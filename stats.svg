    <rect width="1200" height="300" fill="url(#grid)"/>
    <ellipse class="glow" cx="300" cy="150" rx="380" ry="180" fill="url(#glow)"/>
    <clipPath id="bar"><rect x="620" y="92" width="532" height="12" rx="6"/></clipPath>
    <rect x="580" y="40" width="1" height="220" fill="#eef7f8" opacity=".08"/>
