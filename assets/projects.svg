<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f19"/>
      <stop offset=".55" stop-color="#1e3446"/>
      <stop offset="1" stop-color="#111b27"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef7f8"/>
      <stop offset="1" stop-color="#9fc9dc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6d9eb4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6d9eb4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r=".85" fill="#eef7f8" opacity=".22"/><circle cx="24" cy="22" r=".6" fill="#9fc9dc" opacity=".24"/><circle cx="30" cy="4" r=".4" fill="#eef7f8" opacity=".18"/>
    </pattern>
    <clipPath id="card"><rect width="378" height="258" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .title { font-size: 30px; font-weight: 700; fill: url(#title); }
    .desc  { font-size: 19px; fill: #d4e5eb; }
    .lang  { font-size: 17px; fill: #8cabb9; }
    .glow { animation: drift 9s ease-in-out infinite alternate both; }
    .d2 { animation-delay: -3s; }
    .d3 { animation-delay: -6s; }
    @keyframes drift {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(170px, 90px); }
      100% { transform: translate(60px, 150px); }
    }
    .c { animation: in .8s ease-out both; }
    .c2 { animation-delay: .15s; }
    .c3 { animation-delay: .3s; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>

  <g transform="translate(0 0)"><g class="c c1" clip-path="url(#card)">
    <rect width="378" height="258" fill="url(#bg)"/>
    <rect width="378" height="258" fill="url(#grid)"/>
    <ellipse class="glow d1" cx="80" cy="50" rx="200" ry="130" fill="url(#glow)"/>
    <rect y="255" width="378" height="3" fill="#6d9eb4" opacity=".6"/>
    <text class="title" x="28" y="62">VEYLO</text>
    <text class="desc" x="28" y="108">Own VPN service:</text>
    <text class="desc" x="28" y="138">subscription facade,</text>
    <text class="desc" x="28" y="168">routing, node configs.</text>
    <circle cx="36" cy="216" r="7" fill="#3776AB"/>
    <text class="lang" x="52" y="222">Python</text>
  </g></g>

  <g transform="translate(411 0)"><g class="c c2" clip-path="url(#card)">
    <rect width="378" height="258" fill="url(#bg)"/>
    <rect width="378" height="258" fill="url(#grid)"/>
    <ellipse class="glow d2" cx="80" cy="50" rx="200" ry="130" fill="url(#glow)"/>
    <rect y="255" width="378" height="3" fill="#6d9eb4" opacity=".6"/>
    <text class="title" x="28" y="62">Lumberjack Clicker</text>
    <text class="desc" x="28" y="108">Clicker game for</text>
    <text class="desc" x="28" y="138">Yandex Games in plain</text>
    <text class="desc" x="28" y="168">JavaScript, no frameworks.</text>
    <circle cx="36" cy="216" r="7" fill="#F7DF1E"/>
    <text class="lang" x="52" y="222">JavaScript</text>
  </g></g>

  <g transform="translate(822 0)"><g class="c c3" clip-path="url(#card)">
    <rect width="378" height="258" fill="url(#bg)"/>
    <rect width="378" height="258" fill="url(#grid)"/>
    <ellipse class="glow d3" cx="80" cy="50" rx="200" ry="130" fill="url(#glow)"/>
    <rect y="255" width="378" height="3" fill="#6d9eb4" opacity=".6"/>
    <text class="title" x="28" y="62">VEYLO Bot</text>
    <text class="desc" x="28" y="108">User dashboard, QR subs,</text>
    <text class="desc" x="28" y="138">free trial, referrals,</text>
    <text class="desc" x="28" y="168">device limits, admin panel.</text>
    <circle cx="36" cy="216" r="7" fill="#3776AB"/>
    <text class="lang" x="52" y="222">Python</text>
  </g></g>
</svg>
