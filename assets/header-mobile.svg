<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f19"/>
      <stop offset=".55" stop-color="#1e3446"/>
      <stop offset="1" stop-color="#111b27"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef7f8"/>
      <stop offset="1" stop-color="#9fc9dc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6d9eb4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6d9eb4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="9" r="1" fill="#eef7f8" opacity=".22"/><circle cx="29" cy="25" r=".7" fill="#9fc9dc" opacity=".24"/><circle cx="37" cy="5" r=".45" fill="#eef7f8" opacity=".18"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="220" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .glow { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(-70px, 0); } to { transform: translate(70px, 15px); } }
    .line { opacity: 0; animation: type 16s linear infinite both; }
    .l1 { opacity: 1; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    .l4 { animation-delay: 12s; }
    @keyframes type {
      0%   { opacity: 1; clip-path: inset(0 100% 0 0); }
      9%   { opacity: 1; clip-path: inset(0 0 0 0); }
      19%  { opacity: 1; clip-path: inset(0 0 0 0); }
      24%  { opacity: 1; clip-path: inset(0 100% 0 0); }
      100% { opacity: 1; clip-path: inset(0 100% 0 0); }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="220" fill="url(#bg)"/>
    <rect width="600" height="220" fill="url(#grid)"/>
    <ellipse class="glow" cx="300" cy="100" rx="260" ry="130" fill="url(#glow)"/>
    <text class="mono" x="300" y="110" text-anchor="middle" font-size="54" font-weight="700" fill="url(#title)" letter-spacing="2">MostViable</text>
    <g class="mono" font-size="22" fill="#d4e5eb" text-anchor="middle">
      <text class="line l1" x="300" y="168">Python · JavaScript · Go<tspan class="caret" fill="#83c5d4">_</tspan></text>
      <text class="line l2" x="300" y="168">VPN infrastructure &amp; network transports<tspan class="caret" fill="#83c5d4">_</tspan></text>
      <text class="line l3" x="300" y="168">Telegram bots &amp; Yandex Games titles<tspan class="caret" fill="#83c5d4">_</tspan></text>
      <text class="line l4" x="300" y="168">now: building VEYLO<tspan class="caret" fill="#83c5d4">_</tspan></text>
    </g>
    <rect x="0" y="216" width="600" height="4" fill="#6d9eb4" opacity=".6"/>
  </g>
</svg>
