    <text class="h" x="620" y="64">Languages</text>
    <g clip-path="url(#bar)"><rect x="620.0" y="92" width="320.8" height="12" fill="#3572A5"/><rect x="940.8" y="92" width="114.8" height="12" fill="#e34c26"/><rect x="1055.7" y="92" width="48.3" height="12" fill="#f1e05a"/><rect x="1104.0" y="92" width="38.5" height="12" fill="#012456"/><rect x="1142.4" y="92" width="7.4" height="12" fill="#663399"/><rect x="1149.8" y="92" width="2.1" height="12" fill="#89e051"/></g>
    <circle cx="627" cy="144" r="7" fill="#3572A5"/><text class="lang" x="644" y="150">Python</text><text class="pct" x="870" y="150" text-anchor="end">60.3%</text><circle cx="897" cy="144" r="7" fill="#e34c26"/><text class="lang" x="914" y="150">HTML</text><text class="pct" x="1140" y="150" text-anchor="end">21.6%</text><circle cx="627" cy="186" r="7" fill="#f1e05a"/><text class="lang" x="644" y="192">JavaScript</text><text class="pct" x="870" y="192" text-anchor="end">9.1%</text><circle cx="897" cy="186" r="7" fill="#012456"/><text class="lang" x="914" y="192">PowerShell</text><text class="pct" x="1140" y="192" text-anchor="end">7.2%</text><circle cx="627" cy="228" r="7" fill="#663399"/><text class="lang" x="644" y="234">CSS</text><text class="pct" x="870" y="234" text-anchor="end">1.4%</text><circle cx="897" cy="228" r="7" fill="#89e051"/><text class="lang" x="914" y="234">Shell</text><text class="pct" x="1140" y="234" text-anchor="end">0.4%</text>
    <rect y="296" width="1200" height="4" fill="#6d9eb4" opacity=".6"/>
